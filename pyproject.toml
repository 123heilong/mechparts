[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mechparts"
version = "0.1.0"
description = "机械标准件参数化生成器：用代码生成齿轮、法兰并导出 STEP / STL / DXF"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["cad", "mechanical-engineering", "gear", "involute", "flange", "step", "dxf", "build123d"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

# 核心数学层零依赖，只有 cad / 绘图功能才需要可选项
dependencies = []

[project.optional-dependencies]
cad = ["build123d>=0.9"]
draw = ["matplotlib>=3.7", "ezdxf>=1.1"]
all = ["build123d>=0.9", "matplotlib>=3.7", "ezdxf>=1.1"]
dev = ["pytest>=7.4"]

[project.scripts]
mechparts = "mechparts.cli:main"

[tool.setuptools.packages.find]
include = ["mechparts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
